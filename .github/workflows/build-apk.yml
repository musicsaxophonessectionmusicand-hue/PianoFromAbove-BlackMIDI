name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack KivaPFA
        run: unzip -q KivaPFA-Android-source.zip

      - name: Build APK
        run: gradle -p KivaPFA-Android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KivaPFA-debug-apk
          path: KivaPFA-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
